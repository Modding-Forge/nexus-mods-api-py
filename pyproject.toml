[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nexusmods-api"
version = "1.0.0rc1"
description = "Typed sync and async Python clients for the Nexus Mods APIs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Modding Forge" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1,<1",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
sso = [
    "websockets>=15,<17",
]
all = [
    "websockets>=15,<17",
]

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "pyright>=1.1.403",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<8",
    "pytest-mock>=3.14,<4",
    "pyfakefs>=5.9,<7",
    "pyyaml>=6,<7",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
    "twine>=6.1,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nexusmods_api"]

[tool.uv]
package = true

[tool.uv.workspace]
members = []

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["ANN", "B", "D", "E", "F", "I", "RUF", "UP", "W"]
ignore = ["D202", "UP045"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
log_cli = true
log_cli_level = "DEBUG"
addopts = "-vv"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["nexusmods_api"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
