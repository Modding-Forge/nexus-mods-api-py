name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Required quality checks
    uses: ./.github/workflows/ci.yml

  package:
    name: Required package checks
    uses: ./.github/workflows/package.yml

  publish:
    name: Publish to PyPI
    needs: [ci, package]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/nexusmods-api/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/
