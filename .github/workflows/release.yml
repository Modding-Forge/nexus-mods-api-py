name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish, with an optional v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Match tag or input to package version
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: python tools/check_release_version.py "$RELEASE_VERSION"

  ci:
    name: Required quality checks
    needs: validate
    uses: ./.github/workflows/ci.yml

  package:
    name: Required package checks
    needs: validate
    uses: ./.github/workflows/package.yml

  publish:
    name: Publish to PyPI
    needs: [ci, package]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/nexus-mods-api/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub release
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist

      - name: Create release and attach distributions
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'dev') }}
